<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>diag</title></head>
<body>
<canvas id="c" width="640" height="360" style="width:640px;height:360px"></canvas>
<pre id="out">running…</pre>
<script type="module">
import { FlowField } from './lbm-gl.js';
const lines = [];
const say = (s) => { lines.push(s); document.getElementById('out').textContent = lines.join('\n'); };
try {
  const canvas = document.getElementById('c');
  const f = new FlowField(canvas, { spinup: 0, dim: 1 });
  say(`grid ${f.state.nx}x${f.state.ny} radius ${f.radius.toFixed(1)} centre ${f.centre}`);

  const gl = f.gl;
  const probe = (label) => {
    // read the macro texture (rho, ux, uy, solid)
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, f.state.macro, 0);
    const buf = new Float32Array(f.state.nx * f.state.ny * 4);
    gl.readPixels(0, 0, f.state.nx, f.state.ny, gl.RGBA, gl.FLOAT, buf);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(fbo);
    let rmin = 1e30, rmax = -1e30, umin = 1e30, umax = -1e30, solid = 0, nan = 0;
    for (let i = 0; i < buf.length; i += 4) {
      const r = buf[i], ux = buf[i + 1];
      if (!Number.isFinite(r) || !Number.isFinite(ux)) { nan++; continue; }
      if (buf[i + 3] > 0.5) { solid++; continue; }
      rmin = Math.min(rmin, r); rmax = Math.max(rmax, r);
      umin = Math.min(umin, ux); umax = Math.max(umax, ux);
    }
    say(`${label}: steps=${f.steps} rho[${rmin.toFixed(3)},${rmax.toFixed(3)}] ux[${umin.toFixed(5)},${umax.toFixed(5)}] solid=${solid} nan=${nan}`);
  };

  f.advance(1); probe('after 1');
  f.advance(3999); probe('after 4000');
  f.advance(4000); probe('after 8000');
  f.advance(6000); probe('after 14000');

  f.calibrate();
  say(`limit=${f.limit.toExponential(3)} diverged=${f.diverged}`);

  f.render();
  const px = new Uint8Array(canvas.width * canvas.height * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const hist = {};
  let rmin = 255, rmax = 0, bmin = 255, bmax = 0;
  for (let i = 0; i < px.length; i += 4) {
    rmin = Math.min(rmin, px[i]); rmax = Math.max(rmax, px[i]);
    bmin = Math.min(bmin, px[i + 2]); bmax = Math.max(bmax, px[i + 2]);
    const key = `${px[i] >> 5}-${px[i + 1] >> 5}-${px[i + 2] >> 5}`;
    hist[key] = (hist[key] || 0) + 1;
  }
  const top = Object.entries(hist).sort((a, b) => b[1] - a[1]).slice(0, 6);
  say(`canvas R[${rmin},${rmax}] B[${bmin},${bmax}]  top buckets ${JSON.stringify(top)}`);
} catch (err) {
  say(`ERROR ${err.message}`);
}
</script>
</body></html>
